name: Bug report
description: Something doesn't preview, or previews wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you pressed, what you expected, what you saw. A screenshot helps.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type
      description: For example "HEIC photo from an iPhone" or ".pptx from PowerPoint 365". Attach the file if you can share it.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Output of `journalctl --user -u gander -n 50 --no-pager`
      render: text
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and desktop, for example "Omarchy 4.5, Hyprland" or "Arch, Sway"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gander version
      description: Output of `gander --version`
